name: ETFIQ series availability pilot
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/etfiq_series_pilot.yml"
      - "scripts/audit_etfiq_series.py"
  schedule:
    - cron: "30 2 * * 1-5"
permissions:
  contents: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check ETFIQ series endpoints
        run: python scripts/audit_etfiq_series.py
      - name: Upload report
        uses: actions/upload-artifact@v6
        with:
          name: etfiq-series-pilot
          path: data/research/etfiq_series_pilot.json
          retention-days: 30
