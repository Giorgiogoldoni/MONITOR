name: RAPTOR ETF Monitor — Daily Fetch

on:
  schedule:
    # Ogni giorno alle 23:00 CET (22:00 UTC) — dopo chiusura mercati USA
    - cron: '0 22 * * 1-5'
  workflow_dispatch:  # Esecuzione manuale

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Create data directories
        run: |
          mkdir -p data/holdings/GMOM
          mkdir -p data/holdings/RPAR
          mkdir -p data/holdings/DBMF
          mkdir -p data/holdings/AOA
          mkdir -p data/holdings/AOR
          mkdir -p data/holdings/MAGR
          mkdir -p data/holdings/F701
          mkdir -p data/holdings/F703
          mkdir -p data/cftc

      - name: Run holdings fetcher
        run: python scripts/fetch_holdings.py

      - name: Build holdings index
        run: python scripts/build_index.py

      - name: Commit & push data
        run: |
          git config user.name  "RAPTOR Bot"
          git config user.email "raptor-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "data: holdings update $(date -u +%Y-%m-%d)"
          git push
